  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            neon: {
              DEFAULT: '#B77BFF',
              dim: '#7C3AED',
              glow: 'rgba(183, 123, 255, 0.38)',
              soft: 'rgba(168, 85, 247, 0.08)'
            },
            obsidian: {
              DEFAULT: '#05030A',
              card: 'rgba(11, 7, 20, 0.62)',
              border: 'rgba(183, 123, 255, 0.14)'
            }
          }
        }

  </script>
  <style>
    :root {
      --neon: #B77BFF;
      --neon-bright: #E9D5FF;
      --neon-deep: #7C3AED;
      --neon-rgb: 183, 123, 255;
      --bg-dark: #05030A;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-dark);
      color: #F5F3FF;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    ::selection {
      background: #B77BFF;
      color: #05030A;
    }

    /* Ambient Motion Background Grid */
    .mg-grid-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 26% 50%, rgba(139, 92, 246, 0.16) 0%, rgba(124, 58, 237, 0.04) 42%, transparent 72%),
        radial-gradient(circle at 82% 22%, rgba(192, 132, 252, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(88, 28, 135, 0.12) 0%, transparent 60%),
        #05030A;
    }

    .mg-grid-plane {
      position: absolute;
      inset: -45%;
      background-size: 64px 64px;
      background-image:
        linear-gradient(to right, rgba(183, 123, 255, 0.085) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(183, 123, 255, 0.085) 1px, transparent 1px);
      transform: perspective(920px) rotateX(58deg) rotateZ(-14deg) translateY(-6%);
      transform-origin: center center;
      animation: gridDrift 20s linear infinite;
      mask-image: radial-gradient(ellipse at 42% 50%, rgba(0,0,0,0.95) 12%, rgba(0,0,0,0.38) 58%, transparent 84%);
      -webkit-mask-image: radial-gradient(ellipse at 42% 50%, rgba(0,0,0,0.95) 12%, rgba(0,0,0,0.38) 58%, transparent 84%);
    }

    .mg-subgrid-overlay {
      position: absolute;
      inset: 0;
      background-size: 128px 128px;
      background-image:
        linear-gradient(to right, rgba(183, 123, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(183, 123, 255, 0.035) 1px, transparent 1px);
      mask-image: radial-gradient(circle at 45% 50%, black 20%, transparent 88%);
      -webkit-mask-image: radial-gradient(circle at 45% 50%, black 20%, transparent 88%);
    }

    @keyframes gridDrift {
      0% {
        background-position: 0px 0px;
      }
      100% {
        background-position: 64px 128px;
      }
    }

    .mg-scanlines {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(183, 123, 255, 0.01) 4px
      );
    }

    /* FULL-SCREEN 3D KINETIC DRUM STAGE */
    .kinetic-stage {
      position: relative;
      height: calc(100vh - 7.5rem);
      min-height: 480px;
      max-height: 860px;
      width: 100%;
      perspective: 1200px;
      user-select: none;
      overflow: visible;
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.35) 10%,
        #000 28%,
        #000 72%,
        rgba(0, 0, 0, 0.35) 90%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.35) 10%,
        #000 28%,
        #000 72%,
        rgba(0, 0, 0, 0.35) 90%,
        transparent 100%
      );
    }

    @media (max-width: 768px) {
      .kinetic-stage {
        height: 56vh;
        min-height: 380px;
      }
    }

    .kinetic-item {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      transform-origin: left center;
      will-change: transform, filter, opacity;
      transition:
        transform 0.62s cubic-bezier(0.18, 0.89, 0.22, 1.03),
        filter 0.62s cubic-bezier(0.18, 0.89, 0.22, 1),
        opacity 0.58s ease,
        color 0.35s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding-left: 0.25rem;
      text-decoration: none;
    }

    /* Brand Icon displayed on focus */
    .kinetic-brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.25rem;
      height: 3.25rem;
      margin-right: 1.15rem;
      border-radius: 1rem;
      background: rgba(183, 123, 255, 0.12);
      border: 1px solid rgba(183, 123, 255, 0.35);
      color: #E9D5FF;
      transform: translateX(-24px) scale(0.65);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.48s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.38s ease,
        box-shadow 0.38s ease,
        border-color 0.35s ease;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .kinetic-brand-icon {
        width: 4rem;
        height: 4rem;
        margin-right: 1.35rem;
      }
    }

    .kinetic-item.is-active .kinetic-brand-icon {
      transform: translateX(0) scale(1);
      opacity: 1;
      pointer-events: auto;
      box-shadow: 0 0 32px rgba(183, 123, 255, 0.6), inset 0 0 16px rgba(183, 123, 255, 0.22);
      border-color: rgba(183, 123, 255, 0.7);
    }

    .kinetic-item:hover .kinetic-brand-icon {
      box-shadow: 0 0 42px rgba(183, 123, 255, 0.85), inset 0 0 20px rgba(183, 123, 255, 0.35);
    }

    .kinetic-word {
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.98;
      color: #B77BFF;
      white-space: nowrap;
      transition: text-shadow 0.45s ease, color 0.35s ease, transform 0.35s ease;
    }

    .kinetic-item.is-active .kinetic-word {
      color: #C490FF;
      text-shadow:
        0 0 42px rgba(168, 85, 247, 0.62),
        0 0 12px rgba(216, 180, 254, 0.35);
    }

    .kinetic-item:hover:not(.is-active) .kinetic-word {
      color: #D8B4FE;
      text-shadow: 0 0 20px rgba(183, 123, 255, 0.45);
    }

    /* Clickable hyperlink tag when active */
    .kinetic-link-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 1.25rem;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      background: rgba(183, 123, 255, 0.16);
      border: 1px solid rgba(183, 123, 255, 0.4);
      color: #E9D5FF;
      transform: translateX(-12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
      white-space: nowrap;
    }

    .kinetic-item.is-active .kinetic-link-tag {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .kinetic-item.is-active:hover .kinetic-link-tag {
      background: #B77BFF;
      color: #05030A;
      box-shadow: 0 0 24px rgba(183, 123, 255, 0.75);
    }

    /* Minimal Translucent Card */
    .neon-card {
      background: rgba(11, 7, 20, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(183, 123, 255, 0.18);
      transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .neon-card:hover {
      border-color: rgba(183, 123, 255, 0.38);
      box-shadow: 0 10px 34px -14px rgba(139, 92, 246, 0.25);
    }
  </style>
</head>

          word: 'WhatsApp',
          url: 'https://wa.me/917907987676',
          displayUrl: '+91 79079 87676',
          handle: '+91 79079 87676',
          desc: 'Direct production desk for rapid bookings, schedules & quote estimates.',
          iconSvg: `<svg class="w-6 h-6 md:w-8 md:h-8" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm0 17.06c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.3c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c.01 4.54-3.69 8.24-8.22 8.24zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.66.31-.23.25-.88.86-.88 2.1 0 1.23.9 2.43 1.03 2.6.12.17 1.78 2.71 4.3 3.8.6.26 1.07.41 1.44.53.6.19 1.15.16 1.59.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/>
          </svg>`
        },
        {
          id: 'behance',
          word: 'Behance',
          url: 'https://www.behance.net/joefostory',
          displayUrl: 'behance.net/joefostory',
          handle: 'joefostory',
          desc: 'Comprehensive visual treatments, director treatments & portfolio showcases.',
          iconSvg: `<svg class="w-6 h-6 md:w-8 md:h-8" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22 7h-7v-2h7v2zm1.726 10c-.442 1.297-2.029 3-4.976 3-3.418 0-5.75-2.428-5.75-5.733 0-3.376 2.378-5.767 5.617-5.767 3.491 0 5.483 2.502 5.234 6.273h-8.567c.105 1.545 1.231 2.658 2.925 2.658 1.458 0 2.296-.642 2.666-1.431h2.851zm-7.625-4h5.688c-.144-1.294-1.078-2.128-2.613-2.128-1.637 0-2.738.834-3.075 2.128zm-8.851 7h-7.25v-16h7.525c3.551 0 5.725 1.838 5.725 4.887 0 1.79-.877 3.197-2.387 3.91 2.057.739 3.037 2.449 3.037 4.542 0 3.51-2.825 5.661-6.65 5.661zm-4.25-9.395h3.625c1.477 0 2.375-.722 2.375-1.921s-.898-1.884-2.375-1.884h-3.625v3.805zm0 6.595h3.9c1.69 0 2.725-.826 2.725-2.193 0-1.421-1.035-2.207-2.725-2.207h-3.9v4.4z"/>
          </svg>`
        }
      ];

      // --- 2. STATE MANAGEMENT ---
      let activeIndex = 0;
      let autoPlayTimer = null;
      let isAutoPlaying = true;
      let autoPlayIntervalMs = 1600;

      const kineticStage = document.getElementById('kineticStage');
      const activeIndexCounter = document.getElementById('activeIndexCounter');

      // --- 3. RENDER 3D REEL WITH BRAND ICONS & CLICKABLE HYPERLINK MODE ---
      function renderWheelDOM() {
        kineticStage.innerHTML = '';
        SOCIAL_ITEMS.forEach((item, idx) => {
          const row = document.createElement('a');
          row.className = 'kinetic-item group';
          row.dataset.index = String(idx);
          row.href = item.url;
          row.target = '_blank';
          row.rel = 'noopener noreferrer';
          row.setAttribute('aria-label', `Visit ${item.word}`);
          
          row.innerHTML = `
            <span class="kinetic-brand-icon" aria-hidden="true">
              ${item.iconSvg}
            </span>
            <span class="kinetic-word text-5xl sm:text-7xl md:text-8xl lg:text-[6.25rem] tracking-tight">
              ${item.word}
            </span>
            <span class="kinetic-link-tag">
              <span>Open</span>
              <span>↗</span>
            </span>
          `;

          // Click behavior: if clicked when active -> opens hyperlink immediately; if inactive -> focuses first
          row.addEventListener('click', (e) => {
            if (idx === activeIndex) {
              // Active: let the browser open the link naturally (or window.open)
              return;
            } else {
              // Inactive: prevent navigation, bring into focus first
              e.preventDefault();
              setActiveIndex(idx, true);
            }
          });

          kineticStage.appendChild(row);
        });

        updateWheelPositions();
        updateInspectorCard();
      }

      function getCircularOffset(index, current, total) {
        let diff = index - current;
        const half = Math.floor(total / 2);
        if (diff > half) diff -= total;
        if (diff < -half) diff += total;
        return diff;
      }

      function updateWheelPositions() {
        const total = SOCIAL_ITEMS.length;
        const nodes = kineticStage.querySelectorAll('.kinetic-item');
        const isMobile = window.innerWidth < 640;
        const verticalStep = isMobile ? 66 : 96;

        nodes.forEach((node, idx) => {
          const offset = getCircularOffset(idx, activeIndex, total);
          const absOff = Math.abs(offset);

          if (absOff > 3) {
            node.style.opacity = '0';
            node.style.pointerEvents = 'none';
            node.style.transform = `translate3d(48px, calc(-50% + ${offset * verticalStep}px), -380px) rotateX(${offset * -18}deg) rotateZ(${offset * -4}deg) scale(0.6)`;
            node.style.filter = 'blur(14px)';
            node.classList.remove('is-active');
            return;
          }

          node.style.pointerEvents = 'auto';

          if (offset === 0) {
            node.classList.add('is-active');
            node.style.opacity = '1';
            node.style.filter = 'blur(0px) brightness(1.15)';
            node.style.transform = `translate3d(0px, -50%, 0px) rotateX(0deg) rotateZ(0deg) scale(1)`;
            node.style.zIndex = '20';
          } else {
            node.classList.remove('is-active');
            const yPx = offset * verticalStep;
            const xIndent = (isMobile ? 26 : 48) + Math.pow(absOff, 1.35) * (isMobile ? 12 : 18);
            const zDepth = -absOff * 80;
            const rotX = offset * -15;
            const rotZ = offset * -3.5;
            const scale = Math.max(0.65, 1 - absOff * 0.1);
            const blurPx = Math.min(10, absOff * 2.5);
            const opacity = Math.max(0.12, 0.72 - (absOff - 1) * 0.22);

            node.style.opacity = String(opacity);
            node.style.filter = `blur(${blurPx.toFixed(2)}px) brightness(0.78)`;
            node.style.transform = `translate3d(${xIndent.toFixed(1)}px, calc(-50% + ${yPx.toFixed(1)}px), ${zDepth}px) rotateX(${rotX.toFixed(1)}deg) rotateZ(${rotZ.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
            node.style.zIndex = String(20 - absOff);
          }
        });

        const formattedIdx = String(activeIndex + 1).padStart(2, '0');
        const formattedTotal = String(total).padStart(2, '0');
        activeIndexCounter.textContent = `${formattedIdx}/${formattedTotal}`;
      }

      function setActiveIndex(newIndex, userTriggered) {
        const total = SOCIAL_ITEMS.length;
        if (total === 0) return;
        activeIndex = ((newIndex % total) + total) % total;
        updateWheelPositions();
        updateInspectorCard();
        if (userTriggered && isAutoPlaying) {
          restartAutoPlayTimer();
        }
      }

      // --- 4. MINIMAL INSPECTOR CARD UPDATE ---
      function updateInspectorCard() {
        const item = SOCIAL_ITEMS[activeIndex];
        if (!item) return;

        document.getElementById('inspectorIconContainer').innerHTML = item.iconSvg;
        document.getElementById('inspectorTitle').textContent = item.word;
        document.getElementById('inspectorHandle').textContent = item.handle;
        document.getElementById('inspectorDesc').textContent = item.desc;
        document.getElementById('activeShortUrl').textContent = item.displayUrl;

        const openBtn = document.getElementById('openDestinationBtn');
        openBtn.href = item.url;
        document.getElementById('openBtnLabel').textContent = `Visit ${item.word}`;
      }

      // --- 5. AUTO-PLAY LOOP & WHEEL INTERACTION ---
      function startAutoPlayTimer() {
        stopAutoPlayTimer();
        autoPlayTimer = setInterval(() => {
          if (isAutoPlaying) {
            setActiveIndex(activeIndex + 1, false);
          }
        }, autoPlayIntervalMs);
      }

      function stopAutoPlayTimer() {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
        }
      }

      function restartAutoPlayTimer() {
        if (isAutoPlaying) {
          startAutoPlayTimer();
        }
      }

      function updateAutoPlayButtonUI() {
        const icon = document.getElementById('autoPlayIcon');
        const text = document.getElementById('autoPlayText');
        if (isAutoPlaying) {
          icon.textContent = '❚❚';
          text.textContent = 'AUTO';
        } else {
          icon.textContent = '▶';
          text.textContent = 'PAUSED';
        }
      }

      let wheelCooldown = false;
      kineticStage.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (wheelCooldown) return;
        wheelCooldown = true;
        setTimeout(() => { wheelCooldown = false; }, 180);
        if (e.deltaY > 0) {
          setActiveIndex(activeIndex + 1, true);
        } else if (e.deltaY < 0) {
          setActiveIndex(activeIndex - 1, true);
        }
      }, { passive: false });

      let touchStartY = null;
      kineticStage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      kineticStage.addEventListener('touchend', (e) => {
        if (touchStartY === null || e.changedTouches.length === 0) return;
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(dy) > 24) {
          if (dy > 0) setActiveIndex(activeIndex + 1, true);
          else setActiveIndex(activeIndex - 1, true);
        }
        touchStartY = null;
      }, { passive: true });

      kineticStage.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setActiveIndex(activeIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setActiveIndex(activeIndex - 1, true);
        } else if (e.key === 'Enter') {
          const current = SOCIAL_ITEMS[activeIndex];
          if (current) window.open(current.url, '_blank', 'noopener,noreferrer');
        }
      });

      // --- 6. CLIPBOARD COPY ---
      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(`Copied: ${text}`);
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(`Copied: ${text}`);
        } catch (err) {
          showToast('Link ready to share');
        }
        document.body.removeChild(ta);
      }

      let toastTimeout = null;
      function showToast(msg) {
        const banner = document.getElementById('toastBanner');
        document.getElementById('toastMessage').textContent = msg;
        banner.classList.remove('opacity-0', 'translate-y-3');
        banner.classList.add('opacity-100', 'translate-y-0');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          banner.classList.add('opacity-0', 'translate-y-3');
          banner.classList.remove('opacity-100', 'translate-y-0');
        }, 2200);
      }

      // --- 7. EVENT LISTENERS ---
      document.getElementById('prevWheelBtn').addEventListener('click', () => setActiveIndex(activeIndex - 1, true));
      document.getElementById('nextWheelBtn').addEventListener('click', () => setActiveIndex(activeIndex + 1, true));

      document.getElementById('toggleAutoPlayBtn').addEventListener('click', () => {
        isAutoPlaying = !isAutoPlaying;
        updateAutoPlayButtonUI();
        if (isAutoPlaying) startAutoPlayTimer();
        else stopAutoPlayTimer();
      });

      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          autoPlayIntervalMs = Number(btn.getAttribute('data-speed'));
          document.querySelectorAll('.speed-btn').forEach(b => {
            b.classList.remove('text-neon', 'font-bold', 'underline');
            b.classList.add('text-neutral-400');
          });
          btn.classList.add('text-neon', 'font-bold', 'underline');
          btn.classList.remove('text-neutral-400');
          if (isAutoPlaying) startAutoPlayTimer();
        });
      });

      document.getElementById('copyActiveUrlBtn').addEventListener('click', () => {
        const current = SOCIAL_ITEMS[activeIndex];
        if (current) copyTextToClipboard(current.url);
      });

      // --- 8. MOTION GRAPHICS INTERACTIVE CANVAS ---
      const canvas = document.getElementById('mgCanvas');
      const ctx = canvas.getContext('2d');
      let cw = 0, ch = 0;
      let pointerX = -999, pointerY = -999;
      let tick = 0;

      function resizeCanvas() {
        cw = canvas.width = window.innerWidth;
        ch = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => {
        resizeCanvas();
        updateWheelPositions();
      });
      window.addEventListener('mousemove', (e) => {
        pointerX = e.clientX;
        pointerY = e.clientY;
      });

      function drawMotionGridNodes() {
        ctx.clearRect(0, 0, cw, ch);
        tick += 0.016;
        const spacing = 104;
        const cols = Math.ceil(cw / spacing) + 1;
        const rows = Math.ceil(ch / spacing) + 1;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * spacing + ((tick * 12) % spacing);
            const y = r * spacing + Math.sin(tick + c * 0.6 + r * 0.4) * 6;
            const dx = x - pointerX;
            const dy = y - pointerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const proximity = Math.max(0, 1 - dist / 280);

            const alpha = 0.10 + proximity * 0.52;
            ctx.strokeStyle = `rgba(183, 123, 255, ${alpha.toFixed(3)})`;
            ctx.lineWidth = 1;
            const arm = 3 + proximity * 4;
            ctx.beginPath();
            ctx.moveTo(x - arm, y);
            ctx.lineTo(x + arm, y);
            ctx.moveTo(x, y - arm);
            ctx.lineTo(x, y + arm);
            ctx.stroke();
          }
        }
        requestAnimationFrame(drawMotionGridNodes);
      }

      // Initialize everything on load
      resizeCanvas();
      renderWheelDOM();
      startAutoPlayTimer();
      drawMotionGridNodes();
    })();
  </script>
