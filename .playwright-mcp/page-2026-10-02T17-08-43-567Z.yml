            - heading "Brief & Vision" [level=3] [ref=f14e373]
            - paragraph [ref=f14e374]: We start by deeply understanding your goals, audience, and the story you need to tell. This discovery phase shapes everything that follows.
          - generic [ref=f14e375]:
