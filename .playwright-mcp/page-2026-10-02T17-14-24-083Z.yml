          - generic [ref=f22e366]: How We Work
          - heading [level=2] [ref=f22e367]:
            - text: Our creative
            - emphasis [ref=f22e368]: process.
          - paragraph [ref=f22e369]: Every great film starts with a conversation. Here's how we turn your vision into a cinematic reality.
        - generic [ref=f22e370]:
          - generic [ref=f22e371]:
            - generic [ref=f22e372]: 01 / Discover
            - heading "Brief & Vision" [level=3] [ref=f22e373]
            - paragraph [ref=f22e374]: We start by deeply understanding your goals, audience, and the story you need to tell. This discovery phase shapes everything that follows.
          - generic [ref=f22e375]:
            - generic [ref=f22e376]: 02 / Develop
            - heading "Concept & Script" [level=3] [ref=f22e377]
            - paragraph [ref=f22e378]: From mood boards to storyboards and full scripts — we build the conceptual architecture of your film before a single frame is shot.
          - generic [ref=f22e379]:
