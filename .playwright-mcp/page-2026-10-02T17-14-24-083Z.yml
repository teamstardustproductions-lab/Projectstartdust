            - heading "Shoot & Direct" [level=3] [ref=f22e381]
            - paragraph [ref=f22e382]: On set, our crew executes the vision with precision. Every lighting setup, camera move, and performance is guided by our cinematic eye.
          - generic [ref=f22e383]:
