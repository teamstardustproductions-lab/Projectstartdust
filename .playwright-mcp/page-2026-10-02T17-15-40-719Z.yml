            - heading "Brief & Vision" [level=3] [ref=f26e396]
            - paragraph [ref=f26e397]: We start by deeply understanding your goals, audience, and the story you need to tell. This discovery phase shapes everything that follows.
          - generic [ref=f26e398]:
