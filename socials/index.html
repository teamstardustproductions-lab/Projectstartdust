  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }

  <style>
    :root {
      --bg-base: #060309;
      --brand-color: #E1306C;
      --brand-glow: rgba(225, 48, 108, 0.45);
      --glow-1: rgba(225, 48, 108, 0.28);
      --glow-2: rgba(131, 58, 180, 0.22);
      --glow-center: rgba(253, 29, 29, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: #F5F3FF;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      transition: background-color 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    ::selection {
      background: var(--brand-color);
      color: #05030A;
    }

    /* SILKY AMBIENT SHADER GRADIENT BACKDROP (NO LINES, NO BOXES, NO SPARKLES) */
    .shader-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, var(--bg-base) 0%, #030106 100%);
      transition: background 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .shader-glow-1 {
      position: absolute;
      top: 10%;
      left: 12%;
      width: 58vw;
      height: 58vw;
      max-width: 780px;
      max-height: 780px;
      border-radius: 50%;
      background: var(--glow-1);
      filter: blur(130px);
      transition: background 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
      animation: floatOrb1 20s ease-in-out infinite alternate;
    }

    .shader-glow-2 {
      position: absolute;
      bottom: 8%;
      right: 14%;
      width: 52vw;
      height: 52vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      background: var(--glow-2);
      filter: blur(140px);
      transition: background 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
      animation: floatOrb2 24s ease-in-out infinite alternate;
    }

    .shader-glow-3 {
      position: absolute;
      top: 50%;
      left: 45%;
      width: 44vw;
      height: 44vw;
      max-width: 560px;
      max-height: 560px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--glow-center) 0%, transparent 72%);
      filter: blur(100px);
      transition: background 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -45px) scale(1.08); }
      100% { transform: translate(-45px, 55px) scale(0.94); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-75px, 35px) scale(1.1); }
      100% { transform: translate(45px, -65px) scale(0.92); }
    }

    /* VERTICALLY CENTERED 3D KINETIC DRUM STAGE */
    .kinetic-stage {
      position: relative;
      height: calc(100vh - 11rem);
      min-height: 480px;
      max-height: 720px;
      width: 100%;
      perspective: 1200px;
      user-select: none;
      overflow: visible;
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.3) 12%,
        #000 30%,
        #000 70%,
        rgba(0, 0, 0, 0.3) 88%,
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.3) 12%,
        #000 30%,
        #000 70%,
        rgba(0, 0, 0, 0.3) 88%,
        transparent 100%
      );
    }

    @media (max-width: 768px) {
      .kinetic-stage {
        height: 54vh;
        min-height: 380px;
      }
    }

    .kinetic-item {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      transform-origin: left center;
      will-change: transform, filter, opacity;
      transition:
        transform 0.62s cubic-bezier(0.18, 0.89, 0.22, 1.03),
        filter 0.62s cubic-bezier(0.18, 0.89, 0.22, 1),
        opacity 0.58s ease,
        color 0.35s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding-left: 0.5rem;
      text-decoration: none;
    }

    /* REAL OFFICIAL BRAND ICON DISPLAYED ON FOCUS */
    .kinetic-brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      margin-right: 1.25rem;
      border-radius: 1.15rem;
      transform: translateX(-24px) scale(0.65);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.48s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.38s ease,
        filter 0.38s ease;
      flex-shrink: 0;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .kinetic-brand-icon {
        width: 4.25rem;
        height: 4.25rem;
        margin-right: 1.5rem;
      }
    }

    .kinetic-item.is-active .kinetic-brand-icon {
      transform: translateX(0) scale(1);
      opacity: 1;
      pointer-events: auto;
      filter: drop-shadow(0 0 28px var(--brand-glow));
    }

    .kinetic-item:hover .kinetic-brand-icon {
      filter: drop-shadow(0 0 38px var(--brand-glow)) brightness(1.1);
    }

    .kinetic-word {
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.98;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      transition: text-shadow 0.45s ease, color 0.45s ease, transform 0.35s ease;
    }

    .kinetic-item.is-active .kinetic-word {
      color: #FFFFFF;
      text-shadow:
        0 0 45px var(--brand-glow),
        0 0 16px var(--brand-glow);
    }

    .kinetic-item:hover:not(.is-active) .kinetic-word {
      color: #FFFFFF;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.4);
    }

    /* CLICKABLE HYPERLINK TAG WHEN ACTIVE */
    .kinetic-link-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: 1.25rem;
      padding: 0.42rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      transform: translateX(-12px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .kinetic-item.is-active .kinetic-link-tag {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      border-color: var(--brand-color);
      box-shadow: 0 0 20px var(--brand-glow);
    }

    .kinetic-item.is-active:hover .kinetic-link-tag {
      background: var(--brand-color);
      color: #FFFFFF;
      box-shadow: 0 0 30px var(--brand-glow);
    }

    /* MINIMAL TRANSLUCENT CARD */
    .neon-card {
      background: rgba(12, 8, 18, 0.68);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .neon-card:hover {
      border-color: var(--brand-color);
      box-shadow: 0 14px 44px -10px var(--brand-glow);
    }
  </style>
</head>

            <path d="M12 4.5c-4.14 0-7.5 3.36-7.5 7.5 0 3.18 1.98 5.89 4.77 6.98-.07-.59-.13-1.5.03-2.15.14-.59.88-3.73.88-3.73s-.22-.45-.22-1.11c0-1.04.6-1.82 1.36-1.82.64 0 .95.48.95 1.06 0 .64-.41 1.61-.62 2.5-.18.75.37 1.36 1.11 1.36 1.33 0 2.36-1.41 2.36-3.43 0-1.8-1.29-3.05-3.13-3.05-2.13 0-3.39 1.6-3.39 3.25 0 .64.25 1.34.56 1.71.06.07.07.14.05.22-.06.23-.18.75-.21.85-.04.15-.12.18-.27.11-1.02-.47-1.65-1.96-1.65-3.15 0-2.56 1.86-4.92 5.37-4.92 2.82 0 5.01 2.01 5.01 4.7 0 2.8-1.77 5.05-4.22 5.05-.82 0-1.6-.43-1.86-.94l-.51 1.94c-.18.71-.68 1.6-1.02 2.14 1.04.32 2.14.49 3.28.49 4.14 0 7.5-3.36 7.5-7.5s-3.36-7.5-7.5-7.5z" fill="#FFFFFF" />
          </svg>`
        },
        {
          id: 'youtube',
          word: 'YouTube',
          url: 'https://projectstardust.in/',
          displayUrl: 'projectstardust.in',
          handle: '@projectstardust',
          desc: 'High-fidelity 4K video productions, commercials, documentaries & reels.',
          brandColor: '#FF0000',
          brandGlow: 'rgba(255, 0, 0, 0.55)',
          bgBase: '#120202',
          glow1: 'rgba(255, 0, 0, 0.32)',
          glow2: 'rgba(180, 0, 20, 0.22)',
          glowCenter: 'rgba(255, 60, 60, 0.18)',
          iconSvg: `<svg class="w-10 h-10 md:w-12 md:h-12" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="6" fill="#FF0000" />
            <path d="M19.66 8.16a2.02 2.02 0 0 0-1.42-1.43C17 6.4 12 6.4 12 6.4s-5 0-6.24.33c-.68.18-1.23.73-1.42 1.43C4 9.4 4 12 4 12s0 2.6.34 3.84c.19.7.74 1.25 1.42 1.43C7 17.6 12 17.6 12 17.6s5 0 6.24-.33c.68-.18 1.24-.73 1.42-1.43.34-1.24.34-3.84.34-3.84s0-2.6-.34-3.84z" fill="#FF0000" />
            <path d="M10.4 14.4V9.6L14.6 12l-4.2 2.4z" fill="#FFFFFF" />
          </svg>`
        },
        {
          id: 'whatsapp',
          word: 'WhatsApp',
          url: 'https://wa.me/917907987676',
          displayUrl: '+91 79079 87676',
          handle: '+91 79079 87676',
          desc: 'Direct production desk for rapid bookings, schedules & quote estimates.',
          brandColor: '#25D366',
          brandGlow: 'rgba(37, 211, 102, 0.55)',
          bgBase: '#021207',
          glow1: 'rgba(37, 211, 102, 0.3)',
          glow2: 'rgba(18, 140, 66, 0.25)',
          glowCenter: 'rgba(40, 220, 120, 0.18)',
          iconSvg: `<svg class="w-10 h-10 md:w-12 md:h-12" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="12" fill="#25D366" />
            <path d="M12.04 4.5c-4.14 0-7.5 3.36-7.5 7.5 0 1.33.35 2.61.99 3.75L4.5 19.5l3.9-1.02c1.1.6 2.34.92 3.64.92 4.14 0 7.5-3.36 7.5-7.5s-3.36-7.4-7.5-7.4zm4.45 10.6c-.19.53-1.12.98-1.54 1.04-.39.06-.89.09-2.73-.67-2.35-.97-3.84-3.37-3.96-3.53-.12-.16-.96-1.27-.96-2.42 0-1.15.6-1.72.82-1.95.22-.23.47-.28.63-.28.16 0 .32 0 .45.01.14.01.33-.05.51.39.19.46.65 1.59.71 1.7.06.12.1.25.02.4-.08.15-.12.25-.24.39-.12.14-.25.31-.36.42-.12.12-.24.25-.1.49.14.24.62 1.02 1.33 1.65.91.81 1.68 1.06 1.92 1.18.24.12.38.1.52-.06.14-.16.6-.7.76-.94.16-.24.32-.2.54-.12.22.08 1.4.66 1.64.78.24.12.4.18.46.28.06.1.06.58-.13 1.11z" fill="#FFFFFF" />
          </svg>`
        },
        {
          id: 'behance',
          word: 'Behance',
          url: 'https://www.behance.net/joefostory',
          displayUrl: 'behance.net/joefostory',
          handle: 'joefostory',
          desc: 'Comprehensive visual treatments, director treatments & portfolio showcases.',
          brandColor: '#0057FF',
          brandGlow: 'rgba(0, 87, 255, 0.55)',
          bgBase: '#020718',
          glow1: 'rgba(0, 87, 255, 0.32)',
          glow2: 'rgba(0, 140, 255, 0.22)',
          glowCenter: 'rgba(30, 100, 255, 0.2)',
          iconSvg: `<svg class="w-10 h-10 md:w-12 md:h-12" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="5" fill="#0057FF" />
            <path d="M15.5 8h4.5v1.5h-4.5V8zm1.1 7.2c-.3.9-1.3 2-3.3 2-2.3 0-3.9-1.6-3.9-3.9 0-2.3 1.6-3.9 3.8-3.9 2.3 0 3.6 1.7 3.5 4.2h-5.7c.1 1 1 1.8 2.2 1.8 1 0 1.6-.5 1.9-1.1h1.5zm-5.1-2.7h4c-.1-.8-.7-1.5-1.9-1.5-1.1 0-1.8.6-2.1 1.5zm-6.8 4.2H8c2.4 0 3.9-1.2 3.9-3.3 0-1.2-.6-2.1-1.6-2.6 1.4-.5 2-1.7 2-2.9 0-2.3-1.9-3.4-4.5-3.4H4.7v12.2zm2-7.2h1.5c1.1 0 2 .5 2 1.5s-.9 1.5-2 1.5H6.7V9.5zm0 3.7h1.7c1.3 0 2.2.6 2.2 1.7 0 1.2-1 1.8-2.2 1.8H6.7v-3.5z" fill="#FFFFFF" />
          </svg>`
        }
      ];

      // --- 2. STATE MANAGEMENT ---
      let activeIndex = 0;
      let autoPlayTimer = null;
      let isAutoPlaying = true;
      let autoPlayIntervalMs = 1600;

      const kineticStage = document.getElementById('kineticStage');
      const activeIndexCounter = document.getElementById('activeIndexCounter');

      // --- 3. DYNAMIC COLOR ADAPTATION ---
      function applyBrandTheme(item) {
        const root = document.documentElement;
        root.style.setProperty('--bg-base', item.bgBase);
        root.style.setProperty('--brand-color', item.brandColor);
        root.style.setProperty('--brand-glow', item.brandGlow);
        root.style.setProperty('--glow-1', item.glow1);
        root.style.setProperty('--glow-2', item.glow2);
        root.style.setProperty('--glow-center', item.glowCenter);
      }

      // --- 4. RENDER 3D REEL WITH VERTICAL CENTERING ---
      function renderWheelDOM() {
        kineticStage.innerHTML = '';
        SOCIAL_ITEMS.forEach((item, idx) => {
          const row = document.createElement('a');
          row.className = 'kinetic-item group';
          row.dataset.index = String(idx);
          row.href = item.url;
          row.target = '_blank';
          row.rel = 'noopener noreferrer';
          row.setAttribute('aria-label', `Visit ${item.word}`);
          
          row.innerHTML = `
            <span class="kinetic-brand-icon" aria-hidden="true">
              ${item.iconSvg}
            </span>
            <span class="kinetic-word text-5xl sm:text-7xl md:text-8xl lg:text-[6.25rem] tracking-tight">
              ${item.word}
            </span>
            <span class="kinetic-link-tag">
              <span>Open</span>
              <span>↗</span>
            </span>
          `;

          // Direct click behavior:
          row.addEventListener('click', (e) => {
            if (idx === activeIndex) {
              return; // Let browser launch link
            } else {
              e.preventDefault();
              setActiveIndex(idx, true);
            }
          });

          kineticStage.appendChild(row);
        });

        updateWheelPositions();
        updateInspectorCard();
      }

      function getCircularOffset(index, current, total) {
        let diff = index - current;
        const half = Math.floor(total / 2);
        if (diff > half) diff -= total;
        if (diff < -half) diff += total;
        return diff;
      }

      function updateWheelPositions() {
        const total = SOCIAL_ITEMS.length;
        const nodes = kineticStage.querySelectorAll('.kinetic-item');
        const isMobile = window.innerWidth < 640;
        const verticalStep = isMobile ? 66 : 94;

        nodes.forEach((node, idx) => {
          const offset = getCircularOffset(idx, activeIndex, total);
          const absOff = Math.abs(offset);

          if (absOff > 3) {
            node.style.opacity = '0';
            node.style.pointerEvents = 'none';
            node.style.transform = `translate3d(48px, calc(-50% + ${offset * verticalStep}px), -380px) rotateX(${offset * -18}deg) rotateZ(${offset * -4}deg) scale(0.6)`;
            node.style.filter = 'blur(14px)';
            node.classList.remove('is-active');
            return;
          }

          node.style.pointerEvents = 'auto';

          if (offset === 0) {
            node.classList.add('is-active');
            node.style.opacity = '1';
            node.style.filter = 'blur(0px) brightness(1.15)';
            node.style.transform = `translate3d(0px, -50%, 0px) rotateX(0deg) rotateZ(0deg) scale(1)`;
            node.style.zIndex = '20';
          } else {
            node.classList.remove('is-active');
            const yPx = offset * verticalStep;
            const xIndent = (isMobile ? 26 : 48) + Math.pow(absOff, 1.35) * (isMobile ? 12 : 18);
            const zDepth = -absOff * 80;
            const rotX = offset * -15;
            const rotZ = offset * -3.5;
            const scale = Math.max(0.65, 1 - absOff * 0.1);
            const blurPx = Math.min(10, absOff * 2.5);
            const opacity = Math.max(0.12, 0.72 - (absOff - 1) * 0.22);

            node.style.opacity = String(opacity);
            node.style.filter = `blur(${blurPx.toFixed(2)}px) brightness(0.78)`;
            node.style.transform = `translate3d(${xIndent.toFixed(1)}px, calc(-50% + ${yPx.toFixed(1)}px), ${zDepth}px) rotateX(${rotX.toFixed(1)}deg) rotateZ(${rotZ.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
            node.style.zIndex = String(20 - absOff);
          }
        });

        const formattedIdx = String(activeIndex + 1).padStart(2, '0');
        const formattedTotal = String(total).padStart(2, '0');
        activeIndexCounter.textContent = `${formattedIdx}/${formattedTotal}`;
      }

      function setActiveIndex(newIndex, userTriggered) {
        const total = SOCIAL_ITEMS.length;
        if (total === 0) return;
        activeIndex = ((newIndex % total) + total) % total;
        updateWheelPositions();
        updateInspectorCard();
        if (userTriggered && isAutoPlaying) {
          restartAutoPlayTimer();
        }
      }

      // --- 5. MINIMAL DETAIL WINDOW UPDATE ---
      function updateInspectorCard() {
        const item = SOCIAL_ITEMS[activeIndex];
        if (!item) return;

        applyBrandTheme(item);

        document.getElementById('inspectorIconContainer').innerHTML = item.iconSvg;
        document.getElementById('inspectorTitle').textContent = item.word;
        document.getElementById('inspectorHandle').textContent = item.handle;
        document.getElementById('inspectorDesc').textContent = item.desc;
        document.getElementById('activeShortUrl').textContent = item.displayUrl;

        const openBtn = document.getElementById('openDestinationBtn');
        openBtn.href = item.url;
        openBtn.style.background = item.brandColor;
        openBtn.style.boxShadow = `0 0 28px ${item.brandGlow}`;
        document.getElementById('openBtnLabel').textContent = `Visit ${item.word}`;
      }

      // --- 6. AUTO-PLAY LOOP & INTERACTIONS ---
      function startAutoPlayTimer() {
        stopAutoPlayTimer();
        autoPlayTimer = setInterval(() => {
          if (isAutoPlaying) {
            setActiveIndex(activeIndex + 1, false);
          }
        }, autoPlayIntervalMs);
      }

      function stopAutoPlayTimer() {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
        }
      }

      function restartAutoPlayTimer() {
        if (isAutoPlaying) {
          startAutoPlayTimer();
        }
      }

      function updateAutoPlayButtonUI() {
        const icon = document.getElementById('autoPlayIcon');
        const text = document.getElementById('autoPlayText');
        if (isAutoPlaying) {
          icon.textContent = '❚❚';
          text.textContent = 'AUTO';
        } else {
          icon.textContent = '▶';
          text.textContent = 'PAUSED';
        }
      }

      let wheelCooldown = false;
      kineticStage.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (wheelCooldown) return;
        wheelCooldown = true;
        setTimeout(() => { wheelCooldown = false; }, 180);
        if (e.deltaY > 0) {
          setActiveIndex(activeIndex + 1, true);
        } else if (e.deltaY < 0) {
          setActiveIndex(activeIndex - 1, true);
        }
      }, { passive: false });

      let touchStartY = null;
      kineticStage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      kineticStage.addEventListener('touchend', (e) => {
        if (touchStartY === null || e.changedTouches.length === 0) return;
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (Math.abs(dy) > 24) {
          if (dy > 0) setActiveIndex(activeIndex + 1, true);
          else setActiveIndex(activeIndex - 1, true);
        }
        touchStartY = null;
      }, { passive: true });

      kineticStage.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setActiveIndex(activeIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setActiveIndex(activeIndex - 1, true);
        } else if (e.key === 'Enter') {
          const current = SOCIAL_ITEMS[activeIndex];
          if (current) window.open(current.url, '_blank', 'noopener,noreferrer');
        }
      });

      // --- 7. CLIPBOARD COPY ---
      function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(`Copied: ${text}`);
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(`Copied: ${text}`);
        } catch (err) {
          showToast('Link ready to share');
        }
        document.body.removeChild(ta);
      }

      let toastTimeout = null;
      function showToast(msg) {
        const banner = document.getElementById('toastBanner');
        document.getElementById('toastMessage').textContent = msg;
        banner.classList.remove('opacity-0', 'translate-y-3');
        banner.classList.add('opacity-100', 'translate-y-0');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          banner.classList.add('opacity-0', 'translate-y-3');
          banner.classList.remove('opacity-100', 'translate-y-0');
        }, 2200);
      }

      // --- 8. CONTROLS LISTENERS ---
      document.getElementById('prevWheelBtn').addEventListener('click', () => setActiveIndex(activeIndex - 1, true));
      document.getElementById('nextWheelBtn').addEventListener('click', () => setActiveIndex(activeIndex + 1, true));

      document.getElementById('toggleAutoPlayBtn').addEventListener('click', () => {
        isAutoPlaying = !isAutoPlaying;
        updateAutoPlayButtonUI();
        if (isAutoPlaying) startAutoPlayTimer();
        else stopAutoPlayTimer();
      });

      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          autoPlayIntervalMs = Number(btn.getAttribute('data-speed'));
          document.querySelectorAll('.speed-btn').forEach(b => {
            b.classList.remove('text-white', 'font-bold', 'underline');
            b.classList.add('text-neutral-400');
          });
          btn.classList.add('text-white', 'font-bold', 'underline');
          btn.classList.remove('text-neutral-400');
          if (isAutoPlaying) startAutoPlayTimer();
        });
      });

      document.getElementById('copyActiveUrlBtn').addEventListener('click', () => {
        const current = SOCIAL_ITEMS[activeIndex];
        if (current) copyTextToClipboard(current.url);
      });

      window.addEventListener('resize', () => {
        updateWheelPositions();
      });

      // Initialize on load
      renderWheelDOM();
      startAutoPlayTimer();
    })();
  </script>
